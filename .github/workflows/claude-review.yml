name: Claude auto review

# Automatic PR review, intentionally scoped to the github-integration station so
# it does NOT fire on every PR in the repo. Open a PR that changes a file under
# 05-github-integration/ and Claude reviews it. Touch nothing there and this
# workflow is skipped (no job, no credits spent).
#
# Requires the repo secret ANTHROPIC_API_KEY (see 05-github-integration/README.md).

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '05-github-integration/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the changes in this pull request. Focus on correctness,
            bugs, and security issues. Post concise inline comments on the
            specific lines that need attention. Keep it short and skip nitpicks.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 6
