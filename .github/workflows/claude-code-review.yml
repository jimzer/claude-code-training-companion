name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Scoped to the GitHub-integration station so the auto-review stays quiet on
    # the rest of the repo. Open a PR touching this folder to trigger a review;
    # PRs elsewhere are skipped (no job, no usage spent).
    paths:
      - '05-github-integration/**'

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Plain-prompt automation mode: Claude posts one summary comment via the
          # action's built-in GitHub comment tool. Simpler and more reliable than
          # the inline-comment plugin, whose buffered-comment tools were denied.
          prompt: |
            Review the changes in this pull request. Focus on correctness, bugs,
            and security issues. Post your findings as a single concise PR comment,
            grouped by severity. Keep it short and skip nitpicks. If you find
            nothing serious, say so in one line.
